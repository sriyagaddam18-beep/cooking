<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Chef: Pizza Maker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f9f9f9; margin-top: 50px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #ff6f61; color: white; border: none; border-radius: 5px; margin: 5px; }
        button:hover { background-color: #e65b50; }
        .ingredient { font-size: 24px; margin: 10px; display: inline-block; cursor: pointer; padding: 10px; border: 2px dashed #ccc; border-radius: 8px; }
    .ingredient:hover { background-color: #fff0f0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍕 Mini Chef: Pizza Maker</h1>
    <p>Click the ingredients in order: **Dough** ➔ **Sauce** ➔ **Cheese** ➔ **Pepperoni**</p>
    <h3 id="timer">Time Left: 15s</h3>
    <h3 id="status">Status: Get Ready!</h3>
    
    <div id="game-area" style="display:none;">
        <div class="ingredient" onclick="selectIngredient('dough')">🟡 Dough</div>
        <div class="ingredient" onclick="selectIngredient('sauce')">🔴 Sauce</div>
        <div class="ingredient" onclick="selectIngredient('cheese')">🧀 Cheese</div>
        <div class="ingredient" onclick="selectIngredient('pepperoni')">🥩 Pepperoni</div>
    </div>
    
    <button id="start-btn" onclick="startGame()">Start Cooking</button>
</div>

<script>
    let sequence = ['dough', 'sauce', 'cheese', 'pepperoni'];
    let userIndex = 0;
    let timeLeft = 15;
    let timerInterval;
    let isPlaying = false;

    function startGame() {
        userIndex = 0;
        timeLeft = 15;
        isPlaying = true;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        document.getElementById('status').innerText = 'Status: Cook Fast!';
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `Time Left: ${timeLeft}s`;
            if (timeLeft <= 0) {
                endGame(false);
            }
        }, 1000);
    }

    function selectIngredient(item) {
        if (!isPlaying) return;
        
        if (item === sequence[userIndex]) {
            userIndex++;
            if (userIndex === sequence.length) {
                endGame(true);
            }
        } else {
            document.getElementById('status').innerText = 'Status: Wrong ingredient! Game Over!';
            endGame(false);
        }
    }

    function endGame(success) {
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('start-btn').style.display = 'inline-block';
        document.getElementById('start-btn').innerText = 'Play Again';
        
        if (success) {
            document.getElementById('status').innerText = 'Status: Delicious! You won! 🎉';
        }
    }
</script>

</body>
</html>
