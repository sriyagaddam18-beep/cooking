<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitChef: The Web Challenge</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2ecc71;
            --text: #2c3e50;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            text-align: left;
        }

        button:hover {
            border-color: var(--primary);
            background-color: #f0fdf4;
            transform: translateY(-1px);
        }

        .score-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            text-align: center;
            border: none;
        }
        .restart-btn:hover {
            background-color: #27ae60;
            color: white;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Menu Screen -->
    <div id="menu-screen" class="screen active">
        <h1>🍳 GitChef Web Challenge</h1>
        <p>Pick a recipe to start cooking:</p>
        <div class="btn-group">
            <button onclick="startRecipe('burger')">🍔 Classic Burger</button>
            <button onclick="startRecipe('pizza')">🍕 Woodfired Pizza</button>
            <button onclick="startRecipe('sushi')">🍣 Traditional Sushi</button>
        </div>
    </div>

    <!-- Gameplay Screen -->
    <div id="game-screen" class="screen">
        <h1 id="recipe-title">Recipe Title</h1>
        <p id="step-description">Step text goes here</p>
        <div class="btn-group" id="options-container">
            <!-- Buttons dynamically generated by JS -->
        </div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="screen">
        <h1>⭐ Final Evaluation ⭐</h1>
        <div class="score-display" id="final-score">0 / 80</div>
        <p id="feedback-text">Feedback text goes here</p>
        <div class="btn-group">
            <button class="restart-btn" onclick="resetGame()">Cook Something Else</button>
        </div>
    </div>
</div>

<script>
    // Game Content Data Matrix
    const gameData = {
        burger: {
            title: "🍔 The Perfect Burger",
            steps: [
                { text: "Step 1: Choose your protein!", options: ["Beef Patty (+20)", "Plant-based Patty (+20)", "An old boot (-10)"], scores: [20, 20, -10] },
                { text: "Step 2: How long do you grill it?", options: ["Rare - 30s (+10)", "Medium - 3m (+30)", "Charcoal - 30m (-20)"], scores: [10, 30, -20] },
                { text: "Step 3: Choose toppings!", options: ["Cheese & Lettuce (+30)", "Only Ketchup (+15)", "Chocolate Sauce (-30)"], scores: [30, 15, -30] }
            ]
        },
        pizza: {
            title: "🍕 Woodfired Pizza",
            steps: [
                { text: "Step 1: Select your dough base!", options: ["Hand-tossed Neapolitan (+30)", "Pre-made frozen crust (+10)", "Cardboard box (-20)"], scores: [30, 10, -20] },
                { text: "Step 2: Select your sauce base!", options: ["San Marzano Tomato (+20)", "Spicy BBQ Sauce (+15)", "Mayonnaise (-15)"], scores: [20, 15, -15] },
                { text: "Step 3: Choose toppings!", options: ["Fresh Mozzarella & Basil (+30)", "Pineapple & Ham (+20)", "Jellybeans (-30)"], scores: [30, 20, -30] }
            ]
        },
        sushi: {
            title: "🍣 Traditional Sushi",
            steps: [
                { text: "Step 1: Prepare your rice!", options: ["Seasoned Short-grain (+30)", "Long-grain Basmati (+5)", "Leftover sticky rice (-10)"], scores: [30, 5, -10] },
                { text: "Step 2: Select the seafood fill!", options: ["Fresh Sashimi Tuna (+30)", "Smoked Salmon (+20)", "Raw Hot Dog Slices (-25)"], scores: [30, 20, -25] },
                { text: "Step 3: How do you roll the Nori?", options: ["Tight cylinder with mat (+20)", "Loose bare-hand roll (+10)", "Squished into a ball (+0)"], scores: [20, 10, 0] }
            ]
        }
    };

    let currentRecipe = null;
    let currentStep = 0;
    let totalScore = 0;

    function startRecipe(recipeKey) {
        currentRecipe = gameData[recipeKey];
        currentStep = 0;
        totalScore = 0;
        
        switchScreen('menu-screen', 'game-screen');
        renderStep();
    }

    function renderStep() {
        const stepData = currentRecipe.steps[currentStep];
        document.getElementById('recipe-title').innerText = currentRecipe.title;
        document.getElementById('step-description').innerText = stepData.text;
        
        const container = document.getElementById('options-container');
        container.innerHTML = ''; // Clear prior buttons
        
        stepData.options.forEach((optionText, index) => {
            const btn = document.createElement('button');
            btn.innerText = optionText;
            btn.onclick = () => handleChoice(stepData.scores[index]);
            container.appendChild(btn);
        });
    }

    function handleChoice(scoreChange) {
        totalScore += scoreChange;
        currentStep++;
        
        if (currentStep < currentRecipe.steps.length) {
            renderStep();
        } else {
            showResults();
        }
    }

    function showResults() {
        switchScreen('game-screen', 'results-screen');
        document.getElementById('final-score').innerText = `${totalScore} / 80`;
        
        let feedback = "";
        if (totalScore >= 70) {
            feedback = "🎉 3 Michelin Stars! You're a Master Chef!";
        } else if (totalScore >= 40) {
            feedback = "👍 Good job! Tasty enough to serve in a local cafe.";
        } else {
            feedback = "💀 Back to culinary school for you!";
        }
        document.getElementById('feedback-text').innerText = feedback;
    }

    function resetGame() {
        switchScreen('results-screen', 'menu-screen');
    }

    function switchScreen(hideId, showId) {
        document.getElementById(hideId).classList.remove('active');
        document.getElementById(showId).classList.add('active');
    }
</script>

</body>
</html>
